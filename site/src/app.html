<!doctype html>
<html lang="en">
  <head>
    <meta name="author" content="Janosh Riebesell" />
    <!-- FOUC mirror of svelte-widgets apply_theme_mode. -->
    <script>
      {
        let effective_theme
        try {
          effective_theme = localStorage.getItem(`theme`)
        } catch {}
        if (effective_theme !== `light` && effective_theme !== `dark`)
          effective_theme = globalThis.matchMedia?.(`(prefers-color-scheme: dark)`)
            ?.matches
            ? `dark`
            : `light`
        document.documentElement.style.colorScheme = effective_theme
        document.documentElement.dataset.theme = effective_theme
      }
    </script>
    <meta
      name="keywords"
      content="materials discovery, inorganic crystal stability, machine learning, interatomic potential, Bayesian optimization, high-throughput search, convex hull, formation energy"
    />

    <meta name="og:card" content="summary" />
    <meta name="twitter:site" content="@jrib_" />
    <meta name="twitter:creator" content="@jrib_" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <meta property="og:type" content="article" />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:url" content="https://janosh.github.io/matbench-discovery" />
    <meta property="twitter:site_name" content="Matbench Discovery" />

    <link rel="icon" href="/favicon.svg" />
    <!-- RSS feed -->
    <link
      rel="alternate"
      type="application/rss+xml"
      href="/rss.xml"
      title="Matbench Discovery Models"
    />
    <!-- analytics -->
    <script
      defer
      data-domain="matbench-discovery.materialsproject.org"
      src="https://plausible.io/js/plausible.js"
    ></script>
    <!-- math display -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"
    />

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <!-- Let main grow to keep the footer at the viewport bottom on sparse pages. -->
    <div style="display: flex; min-height: 100dvh; flex-direction: column">
      %sveltekit.body%
    </div>
  </body>
</html>
