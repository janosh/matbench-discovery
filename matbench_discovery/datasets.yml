  role: test
  static: true
  date_created: 2020-07-18
  license: CC0-1.0
  method: DFT
  params:
    functional: PBE
    basis: def2-SVP
  description: |
    Molecular-dynamics configurations of ten molecules with energies and forces recomputed using tight convergence and dense integration grids. Provides fixed training and test splits for evaluating molecular force-field learning.
  notes:
    Size: Materials counts the ten molecules in the [release](https://doi.org/10.6084/m9.figshare.12672038.v4). Nine have 100,000 configurations each; azobenzene has 99,988 after failed calculations, giving 999,988 total structures.
    Sampling: Frames come from correlated time series. The authors recommend using the supplied small training splits rather than treating large random frame samples as independent data.

