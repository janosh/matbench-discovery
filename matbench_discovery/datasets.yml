  description: |
    Updated MAD release covering 102 elements, extending structural diversity to molecular clusters and adsorbed molecules. Provides r2SCAN training, validation, and test files, plus a separately labeled PBE subset.
  notes:
    Size: Counted 315,314 training, 23,661 validation, and 23,671 test configurations in the [versioned r2SCAN XYZ files](https://archive.materialscloud.org/records/wtpqr-2cj66), with distinct subset/frame_id pairs and matching release checksums. Excludes the 8,244 rejected structures and overlapping PBE relabelings.
    Labels: The [release README](https://archive.materialscloud.org/api/records/wtpqr-2cj66/files/README.md/content) states that r2SCAN stresses are available only for the mc3d_rattled subset; other structures should not be assumed to carry stress labels.

