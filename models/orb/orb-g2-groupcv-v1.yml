notes:
  description: |
    Frozen ORB-v3 conservative MPA with a 36-coefficient smooth pair-energy calibration.
    Multi-atom and periodic energy/force/stress inference is supported. It is trained
    on multi-atom molecular atomization energies, not isolated diatomics.
  protocol: |
    A metadata-only SHA256 formula-group split (seed20261116) reserves19 molecules/18 groups.
    Training has83 molecules/68 groups; all one/two-atom species are excluded. GP-EI selects
    ridge, width and fixed-grid shrinkage using training-only5-fold formula-group CV.
    Each fold fits scales/coefficients on its training groups only; outer rows are rejected.
    The final candidate is frozen before the first held-out target export.
  reference: |
    ASE3.29.0 G2 experimental atomization energies extrapolated using calculated ZPE/thermal
    corrections, converted kcal/mol to eV. Source geometries/reference conventions are preserved.
    These are not PBE force labels; no force or stress targets are fitted.
  disclosure: |
    Earlier PET/ORB Diatomics scores and public task rankings influenced this backbone/redesign,
    so diatomics is explicitly test_set_informed. Freezing/refitting does not erase historical
    exposure. Official homonuclear labels are not used for fit/search. G2 holdout labels and
    official scores never reselect this checkpoint. Upstream pretraining overlap is not proven absent.
    Historical sources: https://github.com/janosh/matbench-discovery/pull/416 and
    https://github.com/nkwork9999/orb-g2-groupcv/releases/tag/v0.1.2 .
    Prior selection-review lesson: https://github.com/materialsproject/matbench/pull/363#issuecomment-6379417619 .
  heldout_results: |
    Fixed held-out formula-macro atomization MAE: unchanged ORB0.493296 eV, calibrated0.217541 eV.
    15/18 groups improved and3 worsened. Small molecular holdout only; no demonstrated bulk,
    force or MD accuracy improvement. Negative results and an equal-budget Sobol control are retained.
  scope: |
    Correction acts on pairs with both Z in1..17; other pairs retain ORB. The periodic pair
    sum has conservative analytic forces/stress and no isolated-pair atom-count restriction.
    The other official tasks have not been benchmarked; they are not physically inapplicable.
  upstream: |
    ORB code/checkpoint remain Apache-2.0; credit and original training provenance:
    https://github.com/orbital-materials/orb-models and the existing orb-v3.yml entry.
    The25,510,582 frozen base parameters plus36 correction coefficients total25,510,618.
    Upstream weights are separately downloaded and SHA256 verified.
    The frozen backbone retains upstream ORB-v3 OSCD classification; the additional
    G2 calibration data and code are fully public. Translated e3nn equations retain MIT notices.
  runtime: |
    Deployment0.1.3 keeps all learned coefficients/base weights unchanged. MLX0.32.4
    runs the original geometry, ZBL and dense encoder/attention/energy head on Apple GPU.
    CPU topology and original normalization/indexing conventions remain. Derivatives
    of raw energy with respect to directed edge vectors give conservative forces/stress.
    All183 training/synthetic cases passed atol1e-4+rtol1e-5. Runtime selection uses
    only training geometries, not held-out/official errors; all failed trials remain.
    Four CPU threads remain after a fixed-block1/2/4-thread study. Load includes
    synthetic warm-up/compilation; full sweep reports measured cost, not estimates.
    MacOS14-compatible official wheels pin the same MLX version with smaller footprint.
    CPU inference remains available for reproduction; reported evaluation uses Metal.
  environment: |
    Native Python3.14 uses a documented uv project override: dm-tree0.1.10 replaces upstream
    dm-tree0.1.8 for wheels, and filelock4.2.10 satisfies the benchmark core despite cached-path<4.
    Compatibility-only overrides are checked by real inference/reproduction; no base weights change.
