environment: # provenance of the authors' runs (no installable package: closed model)
  python_version: '3.14'
  dependencies:
  - torch==2.11.0 # +cu128 build used for inference
  - torch-geometric==2.8.1
  - torch-scatter==2.1.2
  - matscipy==1.3.1
  - numpy==2.5.4
  - ase==3.29.0
  - matbench-discovery==1.3.1 # shared runners at main 2b7bff9 (2026-10-30) / c70947f (2026-11-02)

openness: CSOD # closed source (code and weights unreleased), open training data (MPtrj)
architecture_types: [gnn, transformer]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
# trainable parameters of the built model (buffers not counted)
model_params: 7414273
fine_tune: false
training_cost:
  entries:
  - hardware: NVIDIA A40 / L40S (mixed)
    count: 8
    hours_per_device: 158.0

hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.01
      max_steps: 300
      force_max: 0.0001
      relaxation_mode: two-stage
      is_plusminus: true
      save_forces: true
  architecture:
    graph_construction_radius: 6.0
    max_neighbors: 120
    num_layers: 4
    embedding_dim: 256
    attention_heads: 16
    l_max: 3
    radial_basis: 64 Bessel
  training:
    optimizer: Muon

notes:
  description: |
    GXTNet is a graph-transformer interatomic potential (GINE message passing + sparse attention with a virtual node)
    with conservative forces and stress and a ZBL short-range repulsion; it is not rotation-equivariant by construction.
  training: |
    Training was done by: (1) direct (non-conservative) pre-training on MPtrj; (2) conservative fine-tuning on MPtrj.

