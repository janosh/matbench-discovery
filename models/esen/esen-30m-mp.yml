environment:
  # Display/provenance pins; install is owned by project (override-dependencies).
  dependencies:
  - 'fairchem-core[torch-extras]==1.10.0'
  - torch==2.10.0+cu126
  python_version: '3.14'
  project: models/eqv2/fairchem-env
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
size: 30M
model_params: 30085121
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
  architecture:
    graph_construction_radius: 6.0
notes:
  description: |
    equivariant Smooth Energy Network (eSEN), described in https://arxiv.org/abs/2502.12147.
  training: |
    Training was done by: (1) 70-epoch direct pre-training on MPtrj with DeNS; (2) 30-epoch conservative fine-tuning on MPtrj without DeNS.

