openness: OSOD
architecture_types: [gnn]
train_task: S2RE
test_task: IS2RE
targets: E
training_sets: [MP 2022]
model_params: 8268453 # 4,688,656 MACE-MP-0 (frozen) + 3,579,797 LightGBM tree nodes (3 seeds)
n_estimators: 3

notes:
  hyperparams: |
    Backbone: MACE-MP-0 medium, frozen (2023-12-03-mace-128-L1_epoch-199.model, MPtrj only), one
    float32 single point per unrelaxed structure.
    Head: LightGBM regressor of r = E_DFT_relaxed/atom - E_MACE(input)/atom; objective huber
    (alpha 0.1), learning_rate 0.05, num_leaves 255, min_data_in_leaf 40, feature_fraction 0.5,
    bagging_fraction 0.8, bagging_freq 1, lambda_l2 1.0, up to 5000 rounds, early stopping 200.
    Features: MACE energy/atom, force statistics, Voigt stress, pressure, shear, volume/atom,
    V*p^2, V*shear^2, log n_atoms, 256 mean-pooled invariant MACE node features, 94 element fractions.
    Training data: 153,454 MP 2022 GGA/GGA+U relaxed structures (<=200 atoms) + 3 perturbed copies
    each = 613,816 (log-uniform volume ratio 0.80-1.25, traceless symmetric shear std 0.02, rattle
    std 0.05 A). 10 % of chemical systems held out from MP for early stopping. Ensemble: mean of 3 seeds.
    Code: train_mace_sp_head.py / test_mace_sp_head_discovery.py / sp_features.py in the linked repo.
  description: |
    Relaxation-free stability prediction. A frozen MACE-MP-0 model (MPtrj only) is evaluated once
    on the unrelaxed WBM structure. On an unrelaxed structure that energy is an upper bound of the
    relaxed energy. The gap is the relaxation energy, which to second order is set by the forces
    (-1/2 f^T H^-1 f) and the stress (-V sigma^2 / 2B). A LightGBM head learns this residual from
    the single-point forces, stress and invariant MACE features. No geometry optimization is done
    at inference: one force-field call per structure.

    Without the head, the raw MACE-MP-0 single point on the initial structures gives unique-
    prototype F1 0.554, DAF 4.699 and MAE 0.129 eV/atom. Its energies are systematically too
    high, so precision is high (0.72) and recall low (0.45). The head lifts F1 to 0.654.
  training: |
    The head is trained on MP 2022 data only: relaxed structures plus perturbed copies (as in
    CGCNN+P), each labeled with the relaxed uncorrected DFT energy. No WBM data was used for
    training, early stopping or model selection. The three seeds give unique-prototype F1 0.6509,
    0.6544 and 0.6526, and the submitted file is their mean. The MP2020 correction is applied as in
    the official MLIP pipeline, using the WBM entry's calculation parameters, with oxide typing from
    the initial structure.
  caveats: |
    The head splits partly on near-zero force statistics. For high-symmetry cells these are float32
    noise, so per-structure predictions can differ by up to ~0.02 eV/atom (mean 5e-4) between runs
    with different GPU batching. Rerunning the submitted test script from scratch reproduced the
    metrics to within 2e-4 in F1.
  ai_assistance: |
    The method was designed, implemented, run and documented by an AI agent (Anthropic Claude via
    Claude Code) operating the Ephemeral6 account. The full research log, including all WBM
    evaluations, is in the linked repo (LOG.md).

