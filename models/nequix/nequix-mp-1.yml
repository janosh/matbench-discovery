environment:
  dependencies:
  - nequix
  - 'jax[cuda12]'
  - e3nn-jax
  - jraph==0.0.6.dev0
  - equinox
  - optax==0.2.5
  - ase==3.24.0
  - tqdm==4.67.1
  - wandb==0.19.11
  - pyyaml==6.0.2
  - matscipy
  - h5py==3.14.0
  - wandb-osh==1.2.2
  - cloudpickle==3.1.1
  python_version: '3.14'
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
model_params: 707658
training_cost:
  entries:
  - hardware: NVIDIA A100
    count: 4
    hours_per_device: 125.0
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      max_steps: 500
      force_max: 0.02
      save_forces: true
  architecture:
    graph_construction_radius: 6.0
  training:
    batch_size: 256
    epochs: 100
    optimizer: Muon
  upstream_config:
    hidden_irreps: 128x0e+64x1o+32x2e+32x3o
    lmax: 3
    radial_basis_size: 8
    radial_mlp_size: 64
    radial_mlp_layers: 2
    radial_polynomial_p: 6.0
    layer_norm: true
    weight_decay: 0.001
    warmup_epochs: 0.1
    warmup_factor: 0.2
    grad_clip_norm: 100
    loss:
      energy: mae
      force: l2
      stress: mae
    loss_weights:
      energy: 20.0
      force: 20.0
      stress: 5.0
    ema_decay: 0.999
notes:
  description: Nequix is a simplified version of NequIP with added RMSnorm, implemented in JAX, and trained with Muon optimizer.

