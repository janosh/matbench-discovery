environment:
  python_version: '3.14'
  dependencies:
  - MACE-SOYO @ git+https://github.com/PrincessHakuryu/MACE-SOYO.git@387b5114c974fb04b8aceffac82d1d8f10ea4ac0
  - torch==2.12.0+cu126
  - cuequivariance==0.12.0
  - cuequivariance-torch==0.12.0
  - cuequivariance-ops-cu12==0.12.0
  - cuequivariance-ops-torch-cu12==0.12.0
  - torch-sim-atomistic==0.6.1
  - nvalchemi-toolkit-ops[torch]==0.4.1
  - warp-lang==1.13.0
  - torch-ema==0.3
  - torch-geometric==2.7.0
  - ase==3.29.0
  - ase-db-backends==0.11.0
  - lmdb==2.3.0
  - h5py==3.16.0
  - tables==3.11.1
  - numpy>=2.4.6
  - scipy==1.18.1
  - PyYAML==6.0.3
  - tqdm==4.70.1
  - numexpr==2.14.2
  - opt_einsum_fx==0.1.4
  - cffi==2.1.1
  find_links:
  - https://download.pytorch.org/whl/cu126/torch/

hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      save_forces: true
      displacement_distance: 0.03
      force_max: 0.0001
      max_steps: 300
  architecture:
    n_layers: 2
    graph_construction_radius: 6.0
  training:
    epochs: 100
    optimizer: AdamW+Muon
  upstream_config:
    loss: Huber
    loss_weights:
      energy: 1.0
      force: 1.0
      stress: 1.0
    weight_decay: 0.001
    compile_training: true
    model_dtype: float32
    clip_grad_norm: 10
    ema_decay: 0.999
    max_learning_rate: 0.001
    min_learning_rate: 0.00001
    learning_rate_schedule: WSD(Warm-up,Stable,Decay)
    warmup_factor: 0.1
    warmup_epochs: 0.2
    wsd_decay_ratio: 0.65
    batch_size: 48
    num_bessel_basis: 16
    num_heads: 1
    use_spin_charge: false
    readout_hidden: 64
    node_dim: 512
    max_l: 1
    max_ell: 3
    max_correlations: 3
    use_zbl: true
    pair_dim: 128
    edge_weight_dim: 96
notes:
  description: MACE-SOYO is based on the MACE-MH-1 architecture, with modifications to edge weights, equivariant RMSNorm, and the readout. Compared with the original MACE-MH-1 implementation, inference and training are accelerated using AOTI and torch.compile, respectively. It also adopts the warmup–stable–decay (WSD) learning-rate schedule used in DPA4.
  checkpoint: The benchmark runners download the .pth checkpoint and export it once per GPU architecture to an AOTI .pt2 package (CUDA only). The kappa and diatomics runners also accept an already exported .pt2 via --checkpoint.

