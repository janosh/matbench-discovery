notes:
  description: Frozen MACE-SOYO-OAM salexmp potential plus a 16-parameter energy/force-consistent isolated-dimer radial correction. No D3. Ordinary crystals use the original potential.
  training: Foundation weights by the MACE-SOYO authors remain unchanged; HYD fits only the 16 radial coefficients using independently generated heteronuclear PBE/def2-SVP references and molecule-grouped development cross-validation.
  disclosure: The scientific model was frozen before official evaluation. After the serial official evaluation, canonical-input batching was implemented and numerically verified against frozen serial predictions; the diatomics flag conservatively discloses this post-evaluation execution-path work. No official reference labels or public predictions were used to train, tune, calibrate, ensemble, or select the scientific model.
  wbm_protocol: Zero-step single-point IS2RE predictions cover all 256963 inputs; native postprocessing retains 256963 successful and 0 failed structures. No relaxation, phonons, or molecular dynamics was performed.
  acceleration: Fixed canonical 119-point dimer batches; scalar crystal/stress delegation. Public compiled and raw-checkpoint paths passed all 10948 diatomic points against frozen outputs under the original tolerances, plus 32 WBM structures and seven independent synthetic structures. The formal canonical timing is retained, not replaced by the replay.
  provenance: Base source 387b5114c974fb04b8aceffac82d1d8f10ea4ac0; base checkpoint SHA256 180784bad2fdee6aec58dae2cdb0d581ad1c4f3d2272d2857bce6315ea43b82b; frozen radial file SHA256 cf601a2cda2510069f9efc118c2f7ce47f6201734e5b44480d3ed547af33f3d9.
  attribution: MACE-SOYO by Qi-Ming Liang, Jia-Jie Du, and Zhi-Pan Liu. HYD contributes the independent reference calculations, radial correction, and canonical batching integration.
  unevaluated_tasks: Kappa settings are the standard shared-runner configuration for interface completeness, not measured results. Phonons and molecular dynamics remain pending and have not been evaluated.
