environment:
  python_version: '3.14'
  dependencies:
  - alignn==2026.10.11

openness: OSOD
architecture_types: [gnn]
# energy, forces and stress were all in the training loss
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
# trainable parameters of the built model (buffers not counted)
model_params: 4057473
fine_tune: false
test_set_informed: [discovery, phonons]
training_sets: [MPtrj]
training_cost:
  entries:
  - hardware: NVIDIA GB10
    count: 8
    hours_per_device: 187.9
  reason: Elapsed time of the training job on 8 single-GPU nodes (Slurm).

hyperparams:
  evaluation:
    max_force: 0.05
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      save_forces: true
  architecture:
    graph_construction_radius: 5.0
    three_body_cutoff: 3.5
    max_neighbors: 52
    alignn_layers: 4
    gcn_layers: 4
    hidden_features: 256
    element_embedding: true
    # bond features are scaled by a polynomial envelope that reaches zero
    # at this distance (inner_cutoff in the alignn config)
    envelope_cutoff: 4.0
  training:
    batch_size: 16 # 2 per GPU on 8 GPUs
    epochs: 30
    learning_rate: 0.0003 # OneCycle peak
    weight_decay: 1.0e-5
    optimizer: AdamW
    lr_scheduler: onecycle
    loss: l1
    loss_weights:
      energy: 1.0
      forces: 1.0
      stress: 0.1

notes:
  description: ALIGNN 2.0 universal force field, a pure-PyTorch reimplementation of the atomistic line graph neural network without DGL. Messages pass alternately over an atom graph and a line graph whose nodes are bonds and whose edges carry bond angles. Energy is the only predicted quantity; forces and stress come from one backward pass through the bond vectors. Each atom starts from its CGCNN features plus a learned per-element vector, since the CGCNN features alone are identical for Gd/Sm, Th/Np, La/Ce and Ho/Er.
  training: Trained from scratch on uncorrected MPtrj energies per atom, forces and stress (L1 loss, weights 1, 1 and 0.1) with a random frame-level split of 1,422,355 training and 79,019 each validation and test frames. 30 epochs, OneCycle with peak learning rate 3e-4, AdamW. The submitted checkpoint has the lowest validation loss (the final epoch).
  known_limitations: The energy is discontinuous where neighbors cross the 5 Å graph cutoff (the energy of a Si dimer jumps by 2.2 eV between 4.9999 and 5.0001 Å) and the 3.5 Å three-body cutoff (0.15 eV for the same dimer), because the polynomial envelope only scales bond features up to 4 Å while messages still pass along every edge out to 5 Å. Bonds shorter than 1 Å get a fixed repulsive penalty in the energy that the forces see but not in the energy the calculator returns, so forces and energies are inconsistent there. MPtrj is PBE without dispersion, so van der Waals-bound structures are poorly described.
  disclosure: WBM errors of earlier ALIGNN-FF checkpoints on Gd- and Np-containing structures prompted the per-element embedding, and κ-103 phonon failures of an earlier checkpoint prompted switching on the bond envelope (per the PR 409 submission), so the discovery and phonon test sets informed the architecture.

