environment:
  # torch 2.14 ships cp314 wheels and the whole ALIGNN stack resolves on
  # 3.14, so this matches the runner rather than pinning an older Python
  python_version: '3.14'
  dependencies:
  - alignn==2026.10.11
  - torch>=2.6
  - ase>=3.28
  - jarvis-tools>=2024.10.30
  - numpy
  - scipy

openness: OSOD
architecture_types: [gnn]
# energy, forces and stress were all in the training loss
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
# trainable parameters of the built model (buffers not counted)
model_params: 4057473
fine_tune: false
training_sets: [MPtrj]
training_cost:
  entries:
  - hardware: NVIDIA GB10
    count: 8
    hours_per_device: 187.9
  reason: Elapsed time of the training job on 8 single-GPU nodes (Slurm).

hyperparams:
  evaluation:
    max_force: 0.05
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      save_forces: true
  architecture:
    graph_construction_radius: 5.0
    three_body_cutoff: 3.5
    max_neighbors: 52
    alignn_layers: 4
    gcn_layers: 4
    hidden_features: 256
    element_embedding: true
    # bond features are scaled by a polynomial envelope that reaches zero
    # at this distance (inner_cutoff in the alignn config)
    envelope_cutoff: 4.0
  training:
    batch_size: 16 # 2 per GPU on 8 GPUs
    epochs: 30
    learning_rate: 0.0003 # OneCycle peak
    weight_decay: 1.0e-5
    optimizer: AdamW
    lr_scheduler: onecycle
    loss: l1
    loss_weights:
      energy: 1.0
      forces: 1.0
      stress: 0.1

notes:
  description: |
    ALIGNN 2.0 universal force field: a pure-PyTorch reimplementation of the
    atomistic line graph neural network that removes the DGL dependency. The
    model passes messages alternately over an atom graph and a line graph whose
    nodes are bonds and whose edges carry bond angles. Energy is the only
    directly predicted quantity. Forces and stress follow from one backward pass
    through the interatomic displacement vectors, so the forces are conservative.
    Each atom starts from its embedded CGCNN features plus a learned
    per-element vector, which lets the model tell apart elements whose CGCNN
    features are identical (Gd and Sm, Th and Np, La and Ce, Ho and Er). Bond
    features are scaled by a smooth polynomial envelope that reaches zero at 4 A.
  training: |
    Trained from scratch on MPtrj with energy per atom, forces and stress all in
    the loss (L1, weights 1, 1 and 0.1). Energies are the uncorrected MPtrj
    values. 1,422,355 frames were used for training and 79,019 each for
    validation and testing. Training ran for 30 epochs (OneCycle schedule, peak
    learning rate 3e-4, AdamW, effective batch size 16 on 8 GPUs), and the
    submitted checkpoint is the one with the lowest validation loss, which was
    the final epoch.
  known_limitations: |
    MPtrj is PBE without a dispersion correction, and the model inherits that,
    so layered van der Waals systems and other dispersion-bound structures are
    not well described.
  data_leakage: |
    The model was trained only on MPtrj. No WBM structures, convex-hull data or
    other Matbench Discovery test data were used for training, normalization,
    hyperparameter choice or checkpoint selection, and the checkpoint was picked
    by the MPtrj validation loss. Results of earlier ALIGNN-FF checkpoints on
    this benchmark did shape two design choices. Large errors on WBM structures
    containing Gd and Np showed that the CGCNN features cannot separate some
    element pairs, which led to the per-element embedding (the problem was then
    confirmed on the MPtrj and MatPES test splits). Phonon checks on earlier
    checkpoints, including the near-total failure of one without the envelope,
    led to switching the envelope on, with the envelope and neighbor settings
    copied from the published ALIGNN MatPES models rather than tuned here. An
    earlier fine-tuned checkpoint with the embedding was also evaluated on this
    benchmark. This from-scratch model was chosen for submission before its own
    results were available.
