hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.01
      temperatures: [300]
      ase_optimizer: FIRE
      ase_filter: FrechetCellFilter
      max_steps: 300
      force_max: 0.0001
      save_forces: false
  architecture:
    graph_construction_radius: 6.0

notes:
  figshare_doi: https://doi.org/10.6084/m9.figshare.35010493
  description: |
    Möbius OAM is an equivariant atomistic model pretrained on OMat24 and
    fine-tuned on sAlex and MPTrj. This submission contains the public EQ
    inference checkpoint and the discovery, geometry-optimization, and phonon
    thermal-conductivity artifacts generated from it. The public model key is
    intentionally kept as mobius-oam.
  benchmark: |
    Historical run used Matbench Discovery commit 7a7a941, float32 inference,
    FIRE/FrechetCellFilter, max_force 0.02 eV/Å, and max_steps 500 for discovery
    and geometry optimization. κ used 0.01 Å, 300 K, force_max 1e-4,
    max_steps 300, and save_forces=false. This preserves the historical protocol
    explicitly instead of silently adopting current main's 0.03 Å default.
  reproducibility: |
    The public model.pt is state-identical to the historical epoch-0001
    checkpoint. The submission pins RUNE to public release commit
    7f2a36c643bb79149b4714c04263002b7aea5f92. The harmonic sidecar is omitted
    because it uses schema v2 while current main requires schema v3;
    save_forces=false means no force-set artifact is required.
  checkpoint_sha256: 9d05e3cbad32ef410ab68d9853de5f0a50877ba807e778e0ab570e67e68d72cd
  inference_weight_sha256: 971e74ddfea4026d5507bd5158c825ec4ad07fb58d287670cd3d6ecd5bff3712

