  checkpoint: CC-BY-4.0
  checkpoint_url: https://creativecommons.org/licenses/by/4.0/legalcode

environment:
  dependencies:
  - rune-mlff @ git+https://github.com/Jonsnow-willow/rune@7f2a36c643bb79149b4714c04263002b7aea5f92
  - torch==2.10.0
  python_version: '3.14'
  find_links: []
  extra_index_urls: []
  project:

openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj, OMat24, sAlex]
fine_tune: true
size: 5M
model_params: 5001403

hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      temperatures: [300]
      ase_optimizer: FIRE
      ase_filter: FrechetCellFilter
      max_steps: 300
      force_max: 0.0001
      save_forces: true
  architecture:
    graph_construction_radius: 6.0

notes:
  figshare_doi: https://doi.org/10.6084/m9.figshare.35010493
  description: |
    Möbius OAM is an equivariant atomistic model pretrained on OMat24 and
    fine-tuned on sAlex and MPTrj. This submission contains the public EQ
    inference checkpoint and the discovery, geometry-optimization, and phonon
    thermal-conductivity artifacts generated from it. The public model key is
    intentionally kept as mobius-oam.
  benchmark: |
    Discovery and geometry optimization artifacts remain from Matbench Discovery
    commit 7a7a941, float32 inference, FIRE/FrechetCellFilter, max_force 0.02 eV/Å,
    and max_steps 500. The κ full run uses current main commit
    6d587c184cdb4a4865dc0b15b04a5e6d77ed464f, 0.03 Å displacement, 300 K,
    force_max 1e-4, max_steps 300, save_forces=true, and the complete benchmark
    supercells and q meshes.
  reproducibility: |
    The public model.pt is state-identical to the historical epoch-0001
    checkpoint. The submission pins RUNE to public release commit
    7f2a36c643bb79149b4714c04263002b7aea5f92. RUNE preserves the precision
    stored in the Möbius checkpoint and this model.pt contains float32 weights.
    The current κ rerun stores the required harmonic schema v3 sidecar and HDF5
    force sidecar. Artifact names, sizes, and MD5 values are recorded below.
  checkpoint_sha256: 9d05e3cbad32ef410ab68d9853de5f0a50877ba807e778e0ab570e67e68d72cd
  inference_weight_sha256: 971e74ddfea4026d5507bd5158c825ec4ad07fb58d287670cd3d6ecd5bff3712

