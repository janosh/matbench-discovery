license:
  code: MIT
  code_url: https://github.com/SamsungDS/GGNN
  checkpoint: CC-BY-4.0
  # URL that points to the license file for the model checkpoint, not the checkpoint file itself.
  checkpoint_url: https://creativecommons.org/licenses/by/4.0/legalcode

environment:
  # Display/provenance pins; install is owned by project (override-dependencies).
  dependencies:
  - torch==2.10.0+cu126
  - fairchem-core==1.10.0
  - cuequivariance==0.9.0
  - ggnn @ git+https://github.com/SamsungDS/GGNN@16b5cae47437
  python_version: '3.14'
  project: models/equflash/kappa-env
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj, OMat24, sAlex]
size: 45M
model_params: 44890492
training_cost:
  entries:
  - hardware: NVIDIA H100
    count: 16
    hours_per_device: 100.0
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      relaxation_mode: two-stage
      max_atoms_per_batch: 128
  architecture:
    graph_construction_radius: 6.0
notes: # notes can have any key, be multiline and support markdown.
  description: EquFlashV2 is an E(3)-equivariant machine learning force field that adopts a Transformer-style block architecture without attention mechanisms. Instead, it uses Clebsch–Gordan tensor product message passing, efficiently enabled by cuEquivariance, together with a bilinear gate activation for equivariant feature interactions.

