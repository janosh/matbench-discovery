model_params: 53086304
n_estimators: 2
hyperparams:
  upstream_config:
    prediction_ensemble:
      components:
      - model_key: dpa-4.0.1-pro-mptrj
        weight: 0.5
      - model_key: equiformer-v3-mp
        weight: 0.5
      discovery:
        operator: aligned_formation_energy_mean_v1
        output_round_decimals: 4
      geo_opt:
        operator: periodic_fractional_structure_midpoint_v1
        site_correspondence: published_site_order
        lattice: elementwise_arithmetic_mean
        fractional_coordinates: shortest_periodic_midpoint
      phonons:
        operator: aligned_phonon_output_mean_v1
        alignment: [material_id, q_points, published_band_order]
        averaged_fields:
        - ph_freqs
        - kappa_tot_rta
        - kappa_p_rta
        - kappa_c
        - mode_kappa_tot_rta

notes:
  description: |
    A fixed task-level output ensemble with reference-free generation from two
    compliant MPtrj-only models. Every submitted task uses equal 0.5/0.5 weights
    over the two components' already-published prediction artifacts.
  author_credit: |
    The listed author is the submitter of this artifact combination. The
    component model authors are credited through trained_by and the linked
    upstream model cards.
  task_level_outputs: |
    Discovery formation energies are the aligned arithmetic mean, rounded to
    four decimal places. Geometry uses the elementwise lattice midpoint and the
    shortest-periodic fractional-coordinate midpoint under the published site
    order. Phonon outputs are averaged after exact material-ID, q-grid, tensor,
    and published band-order alignment; the imaginary-mode flag is recomputed
    from the averaged frequencies and conservatively ORed with both input flags.
  label_separation: |
    The components were selected with their already-public leaderboard results
    known. Equal weights, alignment rules, operators, and discovery rounding were
    frozen before any composite metric was evaluated. No WBM or PhononDB DFT
    target value, and no feedback from a composite score, was used to generate or
    tune the submitted predictions.
  limitations: |
    This is a direct task-level output composite, not one interatomic potential
    or ASE calculator. It does not average forces or force constants. The
    geometry midpoint is not asserted to be a stationary point; its endpoint
    energy is the mean of the two raw endpoint energies and is not recomputed at
    the midpoint. Legacy geometry sources lack real converged and n_steps fields,
    which are declared missing rather than invented. Mode-resolved phonon means
    rely on the common q-grid and published band order and are not invariant to
    an arbitrary band permutation or degenerate-subspace rotation.
  component_sources: |
    DPA-4.0.1-Pro-MPtrj model card:
    models/deepmd/dpa-4.0.1-pro-mptrj.yml
    EquiformerV3+DeNS-MP model card:
    models/equiformer_v3/equiformer-v3-mp.yml

