environment:
  python_version: '3.14'
  dependencies:
  # commit on main that holds the packaging patch (the runs used a wheel built from this tree)
  - bam-v2 @ git+https://github.com/myung-group/BAM_V2@c1873e0fe14cacb69775fdb54ccb281269fc82d8
  - jax[cuda12]==0.12.0.1
  - flax==0.12.10
  - optax
  - jraph
  - e3nn-jax==0.21.0
  - vesin==0.6.2
  # fused CUDA kernel of the edge tensor product and the symmetric contraction (GPUs of compute capability >= 8.0)
  - cuequivariance==0.13.0
  - cuequivariance-jax==0.13.0
  - cuequivariance-ops-jax-cu12==0.13.0
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [OMat24, MPtrj, sAlex]
fine_tune: true
test_set_informed: [diatomics]
model_params: 9017332
hyperparams:
  evaluation:
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    max_force: 0.05
    max_steps: 500
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      force_max: 1.0e-4
      max_steps: 300
      symprec: 1.0e-5
      ase_optimizer: FIRE
      ase_filter: FrechetCellFilter
  architecture:
    graph_construction_radius: 7.0
    max_neighbors:
    n_layers: 5
    max_ell: 3
    channels: 128
notes:
  description: |
    RACE v2.1 is a layer-wise equivariant cluster expansion (5 layers, lmax 3, 128 channels, cutoff 7 Å, 9.0M
    parameters) with a bilinear layer update, a 64-channel edge tensor-product bottleneck and a C4 cutoff envelope.
    Forces and stress are derivatives of the energy. Inference runs in float64 with the JAX training code (race_v2)
    and a parameter-free core exclusion: below the shortest distance of an element
    pair in the training data the learned edges are switched off and replaced by ZBL.
  training: |
    OMat24 pretraining from scratch (2 data epochs), fine-tuning on MPtrj ×8 + sAlex ×1 (6.2 data epochs), then a
    replay stage of about 1 data epoch on the fine-tuning stream plus 20 % of OMat24 (forces and stress only).
    The submitted checkpoint is the last epoch of this schedule; no checkpoint selection on benchmark scores.
  disclosure: |
    diatomics: the parameter-free core exclusion (learned edges replaced by ZBL below the shortest distance of an
    element pair in the training data) was added after the diatomic curves of the earlier RACE v2.0 model diverged at
    short range for noble-gas dimers; its distances come from the training data only (MPtrj, sAlex, OMat24:
    race_v2/resources/mindist_train_mptrj_salex_omat24.json in BAM_V2), not from the diatomics test set.
  benchmark_runs: |
    The registered calculator is the JAX model on race_v2.inference.relax_batched.RaceEvaluator (float64, core
    exclusion on), the evaluator of all runs below.
    Molecular dynamics and diatomic curves (2026-11-22): the benchmark's own code (matbench_discovery.md.run_md_benchmark,
    predict_curves / write_results of models/run_diatomics.py, commit 6d587c1) called from the authors' script
    scripts/eval/mbd/md_diatomics.py of the repository with the same evaluator (graphs padded to the structure plus
    6 %: cost label tight_padding, RACE_V2_PAD=tight of the registered calculator) on NVIDIA GH200; not through the
    models/run_*.py entry points.
    Discovery and geometry optimization (2026-11-22): relaxed with the same evaluator and a batched FIRE +
    FrechetCellFilter of the authors (same settings as the shared runner: fmax 0.05 eV/Å, at most 500 steps, float64),
    then converted to the canonical artifacts with matbench_discovery.discovery.write_discovery_artifacts.
    Thermal conductivity (2026-11-26/27): the shared runner models/run_kappa.py (8 shards, merged with --merge-shards)
    with the registered calculator (fused cuEquivariance kernel, float64) on NVIDIA A100-SXM4-80GB.
