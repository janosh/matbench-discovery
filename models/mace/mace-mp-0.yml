license:
  code: MIT
  code_url: https://github.com/ACEsuit/mace/blob/b0fa4ef7c/LICENSE.md
  checkpoint: MIT
  checkpoint_url: https://github.com/ACEsuit/mace-foundations/blob/1ff8786eb/LICENSE

environment:
  dependencies:
  - mace-torch>=0.3.16
  - cuequivariance
  - cuequivariance-torch
  - cuequivariance-ops-torch-cu12
  - torch==2.10.0
  - ase==3.22.1
  - pymatgen==2023.7.14
  - numpy==1.25.0
  python_version: '3.14'
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
model_params: 4688656
hyperparams:
  evaluation:
    max_force: 0.05
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      save_forces: true
  architecture:
    graph_construction_radius: 6.0

notes:
  description: |
    MACE is a higher-order equivariant message-passing neural network for fast and accurate force fields.
  training: The Matbench Discovery submission uses the same MPtrj-trained 'medium' checkpoint used for all analysis in the MACE-MP preprint.

