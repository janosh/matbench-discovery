environment:
  dependencies:
  - bam-torch @ git+https://github.com/myung-group/BAM-torch@24ed0f042660a1e11ad5d91466b4275955df98c6
  - torch==2.13.0 # +cu126 build used for inference
  - e3nn==0.6.0
  # optional equivariance backend
  - openequivariance==0.7.0
  - ase==3.29.0
  - pymatgen==2026.9.24
  python_version: '3.14'
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
model_params: 6468994
training_cost:
  entries:
  - hardware: NVIDIA A100 40GB
    count: 4
    hours_per_device: 858.0 # 620.2 h measured for epochs ~33-118, scaled to all 118 epochs
hyperparams:
  evaluation:
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    max_force: 0.05
    max_steps: 500
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      force_max: 1.0e-4
      symprec: 1.0e-5
      ase_optimizer: FIRE
      ase_filter: FrechetCellFilter
      save_forces: true
  architecture:
    graph_construction_radius: 7.0
    max_neighbors:
notes:
  description: |
    BAM-MP-DeNS is a universal interatomic potential from the BAM-torch BAM_DeNS
    branch (RACE architecture), trained on MPtrj with denoising non-equilibrium
    structures (DeNS) as an auxiliary task. It is evaluated here on WBM IS2RE-SR
    discovery and geometry optimization, PhononDB kappa-103, DynaMat MD, and
    diatomic curves.

