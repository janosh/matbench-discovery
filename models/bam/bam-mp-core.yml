environment:
  dependencies:
  - bam-torch @ git+https://github.com/myung-group/BAM-torch@9329db2cec33715f89efa3f560d3e0f791b3f528
  - torch>=2.5.1
  - e3nn==0.5.6
  - ase>=3.26.0
  - pymatgen>=2025.10.7
  python_version: '3.12'
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
model_params: 17023365
training_cost:
  entries:
  - hardware: NVIDIA H100
    count: 24
    hours_per_device: 62.9
hyperparams:
  evaluation:
    max_force: 0.05
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      force_max: 1.0e-4
      symprec: 1.0e-5
      ase_optimizer: FIRE
      ase_filter: FrechetCellFilter
      save_forces: true
  architecture:
    graph_construction_radius: 6.0
    max_neighbors:
notes:
  description: |
    BAM-MP-core is a universal interatomic potential implemented in the
    BAM-torch codebase and evaluated here on WBM IS2RE-SR structure relaxation,
    discovery, and PhononDB kappa-103 tasks.

