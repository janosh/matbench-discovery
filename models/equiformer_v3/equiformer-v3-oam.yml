environment:
  # Display/provenance pins; install is owned by project (override-dependencies).
  # The published metrics were measured with EquiformerV3's own fairchem-core fork.
  dependencies:
  - fairchem-core @ git+https://github.com/atomicarchitects/equiformer_v3@a7300c58df683dc99cb48027d5bfd4c887486c48#subdirectory=packages/fairchem-core
  - torch==2.10.0+cu126
  python_version: '3.14'
  project: models/equiformer_v3/fairchem-env
openness: OSOD
architecture_types: [transformer]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj, OMat24, sAlex]
model_params: 30333409
training_cost:
  entries:
  - hardware: NVIDIA H100
    count: 32
    hours_per_device: 177.3125
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      save_forces: true
  architecture:
    graph_construction_radius: 6.0
  upstream_config:
    num_blocks: 7
    lmax: 4
    mmax: 2
    embedding_dimension: 128
    attention_value_hidden_size: 32
    num_attention_heads: 8
    attention_alpha_hidden_size: 64
    attention_value_size_per_head: 16
    ffn_hidden_size_after_swiglu_s2_activation: 512
    grid_resolution_attention: (14, 8)
    grid_resolution_ffn: (14, 14)
    DeNS_probability: 0.5
    DeNS_coefficient: 1
    DeNS_noise_std: 0.025
    DeNS_corruption_ratio: 0.5
    DeNS_max_force_norm: 2.5
notes:
  description: EquiformerV3 is the third generation of SE(3)-equivariant graph attention Transformers. Please refer to our paper for more details.


