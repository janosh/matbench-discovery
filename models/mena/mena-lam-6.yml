notes:
  description: >
    Mena-LAM-6 (lam6_v1, 8.48M parameters) is a unified 3-stage equivariant
    message-passing interatomic potential with a smooth 6.0 A radial cutoff (C3 taper
    from 5.0 to 6.0 A), factorized PAW/XC level-of-theory conditioning (separating
    vasp_pbe52, vasp_pbe54, and vasp_pbe64), and continuous cloud-overlap and electronic
    auxiliary heads. For Materials Project benchmarks, MenaCalculator runs in strict IEEE
    float32 (allow_tf32=False) with lot="mp" (MP2020 composition +U rule: O or F together
    with V, Cr, Mn, Fe, Co, Ni, Mo, or W) and add_dispersion=False.
  training: >
    Trained for 747,692 steps (EMA decay 0.999, 48.5 net GPU-hours) from scratch on a
    single NVIDIA RTX PRO 6000 Blackwell GPU across OMol25, SPICE 2, MPtrj, sAlex, OMat24,
    OC20, OC25, MAD-1.6, OMC25, and MatPES (PBE and r2SCAN) using Muon + AdamW with a WSD
    schedule, crystal secant pair loss (P_cry from step 406,311), and an 18-hour strict
    IEEE FP32 cooldown.
  disclosure: >
    Earlier Mena-LAM WBM-5k lanthanide errors prompted factorizing VASP PBE_52 vs PBE_54
    PAW tokens, and mid-run crystal-pair loss ablations included a 250-structure WBM
    subsample check, so the discovery test set informed model development. The submitted
    checkpoint is the final training endpoint (step 747,692).
  discovery: >
    WBM relaxations used a GPU-resident FP64 FIRE + FrechetCellFilter batched stream
    (fmax 0.02 eV/A, max 500 steps, strict IEEE FP32 with Dual-CSR CUDA kernels) on one
    RTX PRO 6000 Blackwell GPU, exported via matbench_discovery.discovery.write_discovery_artifacts.
  phonons: >
    Evaluated with phono3py 3.30.0 / phonopy 3.5.1 (displacement_distance=0.03 A) in strict
    IEEE FP32 with Dual-CSR CUDA kernels on one RTX PRO 6000 Blackwell GPU.
  md: >
    Evaluated on all 17 DynaMat v1.0 systems (80,000 steps NVT Nose-Hoover chain, dt=0.25 fs)
    one system at a time on one RTX PRO 6000 Blackwell GPU using strict IEEE FP32,
    Dual-CSR, torch.compile, and 10-step CUDA graphs (Verlet skin 0.6 A), verified to
    match ASE NoseHooverChainNVT within 1e-7 A over 400 steps.
  diatomics: >
    Evaluated on the official 92 x 119 homonuclear diatomic grid one dimer per ASE call
    on one RTX PRO 6000 Blackwell GPU using strict IEEE FP32, Dual-CSR, and CUDA graphs.

