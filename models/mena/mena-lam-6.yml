notes:
  description: >
    Mena-LAM-6 (lam6_v1, 8.48M total parameters) is a unified 3-stage equivariant
    message-passing potential trained from scratch in 48.5 net GPU-hours on one RTX PRO
    6000 Blackwell GPU across crystals, surfaces, molecular crystals, and open molecules
    (~38% of batches / ~20 GPU-hours dedicated to periodic materials and surfaces; ~62% /
    ~28.5 GPU-hours to open molecules OMol25 and SPICE 2), using factorized PAW/XC
    level-of-theory conditioning (separating vasp_pbe52, vasp_pbe54, and vasp_pbe64). It
    uses a 6.0 A radial cutoff (C3 taper from 5.0 to 6.0 A) with product-only edges and
    Dual-CSR register-streaming kernels (CUDA, Apple Metal, OpenMP CPU) that avoid saving
    edge activation buffers, keeping live memory around 6-38 KB/atom (0.46 GB VRAM on
    DynaMat MD, >300k atoms on a single GPU). Of the 8.48M parameters, ~7.35M form the
    shared trunk, ~0.50M are frozen isolated-atom references, and ~0.63M are dedicated
    molecular/electronic heads (charge, spin, dipole, polarizability, gap) inactive on
    periodic crystals. For Materials Project benchmarks, it runs in float32 under lot="mp"
    (MP2020 composition +U rule) with no D3 dispersion correction.
  training: >
    Trained from scratch for 747,692 steps (EMA 0.999, 48.5 net GPU-hours) on one NVIDIA
    RTX PRO 6000 Blackwell GPU across 11 crystal, surface, and molecular datasets. Roughly
    62% of training batches were dedicated to open molecules (OMol25, SPICE 2) and 38% to
    periodic materials (MPtrj, sAlex, OMat24, MatPES PBE/r2SCAN, OC20, OC25, OMC25, MAD-1.6),
    using Muon + AdamW with a WSD schedule, crystal secant pair loss (P_cry from step
    406,311), and an 18-hour FP32 cooldown.
  disclosure: >
    Earlier Mena-LAM WBM-5k lanthanide errors prompted factorizing VASP PBE_52 vs PBE_54
    PAW tokens, earlier Mena-LAM-preview kappa-103 softening motivated adding crystal
    secant pair supervision (P_cry) and strict IEEE FP32 cooldown, and mid-run P_cry
    ablations checked a 250-structure WBM subsample and a 16-crystal subset of
    PhononDB-103 (SRME 0.326 -> 0.280), so the discovery and phonons test sets informed
    model development. DynaMat MD did not inform LAM-6 design choices. The submitted
    checkpoint is the final training endpoint (step 747,692).
  discovery: >
    WBM relaxations used a custom batched GPU-resident FP64 FIRE + FrechetCellFilter
    engine (fmax 0.02 eV/A, max 500 steps, strict IEEE FP32 with Dual-CSR CUDA kernels)
    on one RTX PRO 6000 Blackwell GPU, exported via
    matbench_discovery.discovery.write_discovery_artifacts. The reported 278.23 s
    run_time_sec comes from this batched GPU engine and is not directly comparable to
    serial ASE runner times. Verified against serial ASE FIRE(FrechetCellFilter) on 50
    random WBM structures (seed 42): 49/50 exact step-count matches, median |dE|/atom
    5.7e-8 eV/at (max 1.7e-5 eV/at), median |dV|/V 1.5e-8 (max 1.8e-4).
  phonons: >
    Evaluated with phono3py 3.30.0 / phonopy 3.5.1 (displacement_distance=0.03 A) in strict
    IEEE FP32 with Dual-CSR CUDA kernels on one RTX PRO 6000 Blackwell GPU.
  md: >
    Evaluated on all 17 DynaMat v1.0 systems (80,000 steps NVT Nose-Hoover chain, dt=0.25 fs)
    one system at a time on one RTX PRO 6000 Blackwell GPU using strict IEEE FP32,
    Dual-CSR, torch.compile, and 10-step CUDA graphs (Verlet skin 0.6 A), verified to
    match ASE NoseHooverChainNVT within 1e-7 A over 400 steps.
  diatomics: >
    Evaluated on the official 92 x 119 homonuclear diatomic grid one dimer per ASE call
    on one RTX PRO 6000 Blackwell GPU using strict IEEE FP32, Dual-CSR, and CUDA graphs.

