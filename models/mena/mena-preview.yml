openness: CSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
model_params: 2215715
training_cost:
  entries:
    - hardware: NVIDIA A100-SXM4-40GB
      count: 1
      hours_per_device: 5.5
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.01
      max_steps: 300
      force_max: 0.0001
      symprec: 1.0e-05
      enforce_relax_symm: true
      conductivity_broken_symm: false
      save_forces: false
  architecture:
    n_layers: 3
    graph_construction_radius: 6.0
  training:
    epochs: 15
    optimizer: Muon + AdamW
notes:
  description: >
    Mena-Preview is a 2.22M-parameter model with a smooth 6.0 A radial cutoff
    (smoothly tapering neighbor interactions between 5.0 A and 6.0 A so that energies
    and forces go continuously to zero as atoms cross the cutoff radius). After many
    iterations and tests, trained on MPtrj for 5.5 hours on a single NVIDIA A100-SXM4-40GB
    (40GB) GPU and evaluated locally on Apple M3 Max (36GB). I named it Mena-Preview
    because there are still speed optimizations and minor architecture improvements planned,
    and training was stopped early due to limited computational resources. This was done
    as an independent work, without further human assistance. I am open to any inquiries
    or questions at francesco.viola001@studenti.uniparthenope.it.
