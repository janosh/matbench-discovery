environment:
  dependencies:
  - prophet-mlip @ git+https://github.com/kairosmaterial/prophet.git@dcfdc0b143978652d573630f1d2a6ce09e0c610a
  - openequivariance>=0.6.8; platform_system == "Linux"
  - phono3py==3.30.0
  - moyopy>=0.12
  python_version: '3.14'
openness: OSCD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj, OMat24, sAlex, ELEMENTA]
model_params: 62296064
training_cost:
  entries:
  - {hardware: NVIDIA A800 SXM4 80GB, count: 120, hours_per_device: 36}
  - {hardware: NVIDIA A800 SXM4 80GB, count: 120, hours_per_device: 76}
  - {hardware: NVIDIA A800 SXM4 80GB, count: 120, hours_per_device: 28}
  - {hardware: NVIDIA A800 SXM4 80GB, count: 120, hours_per_device: 7.25}
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      save_forces: true
  architecture:
    graph_construction_radius: 7.0
  upstream_config:
    num_layers: 10
    lmax: 4
    irreps: 256x0e+96x1o+64x2e+32x3o+32x4e
    radial_basis_size: 64
    radial_mlp_size: 64
    radial_mlp_layers: 2
    cutoffs: [3.0, 7.0]
    pretrain:
      data: OMat24
      optimizer: Muon
      learning_rate: 0.01
      warmup_epochs: 0.1
      weight_decay: 1e-3
      batch_size_per_device: 32
      epochs: 3
      loss: MAE, E/F/S weights 20/20/5
      grad_clip_norm: 100.0
      ema_decay: 0.999
    fine_tune_stage_1:
      data: ELEMENTA
      hyperparameters: identical to pretrain
      epochs: 3
    fine_tune_stage_2:
      data: MPtrj + sAlex
      optimizer: Muon
      learning_rate: 0.01
      warmup_epochs: 0.1
      weight_decay: 1e-3
      batch_size_per_device: 32
      epochs: 10
      loss: MAE, E/F/S weights 20/20/5
      grad_clip_norm: 100.0
      ema_decay: 0.999
    fine_tune_stage_3:
      data: ELEMENTA Vib with full-set MPtrj + sAlex streaming replay
      optimizer: AdamW (AMSGrad)
      learning_rate: 1e-4 -> 1e-6
      warmup_steps: 50
      weight_decay: 1e-6
      batch_size_per_device: 3
      steps: 50000
      loss: MAE, E/F/S weights 20/20/5, thermal sources force-only
      grad_clip_norm: 10.0
      ema_decay: 0.999
      replay_ratio_per_100_steps: MPtrj 35 / sAlex 35 / ELEMENTA 30
notes:
  description: Prophet is an equivariant machine-learning interatomic potential by Kairos Materials (62.3M parameters), built on Multi-Cutoff Spectral Decomposition, which models atomic interactions across nested cutoff scales.

