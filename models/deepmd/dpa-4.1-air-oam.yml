hyperparams:
  evaluation:
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      temperatures:
      - 300
      ase_optimizer: FIRE
      ase_filter: FrechetCellFilter
      force_max: 0.0001
      max_steps: 300
      symprec: 1.0e-05
      conductivity_broken_symm: false
      save_forces: true
    ase_optimizer: FIRE
    max_force: 0.02
    max_steps: 500
    cell_filter: FrechetCellFilter
  architecture:
    preset: dpa4-air-v20260911
  training:
    optimizer: HybridMuon
notes:
  description: >-
    DPA-4.1-Air-OAM is a 5.1-million-parameter DPA4 interatomic potential trained on
    MPtrj, OMat24 and sAlex. Its SE(3)-equivariant architecture combines
    angular-degree coupling in SO(2) convolutions, multi-focus representations,
    attention and Wigner bilinear nonlinearities. Forces and stresses are derived from
    a single energy model.
  evaluation: >-
    Per-structure relaxation convergence and iteration counts were not recorded. MD
    energy and force RMSEs are not reported because the labeled reference data are not
    publicly available.
  diatomics: >-
    Some homonuclear pairs, especially Ne, exhibit large errors and numerical
    sensitivity at short separations. No elements were excluded from the metrics.
  disclosure: >-
    The DPA4 paper ([arXiv:2606.02419](https://arxiv.org/abs/2606.02419), Methods 4.1 and Supp. S-3) chose architecture and training-schedule defaults with ablations evaluated on a fixed subsample of the WBM test set, so WBM informed model development.

