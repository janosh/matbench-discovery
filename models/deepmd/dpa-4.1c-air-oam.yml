notes:
  description: >-
    DPA-4.1C-Air-OAM is a compact, 0.43-million-parameter DPA4C interatomic potential
    trained on MPtrj, OMat24 and sAlex. Its O(3)-equivariant architecture uses a
    single local aggregation and an invariant energy readout. The local representation
    supports tabulated compression and large-scale parallel molecular dynamics, with
    forces and stresses derived from the energy.
  evaluation: >-
    Per-structure relaxation convergence and iteration counts were not recorded. MD
    energy and force RMSEs are not reported because the labeled reference data are not
    publicly available.

