hyperparams:
  evaluation:
    ase_optimizer: FIRE
    max_force: 0.02
    max_steps: 500
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      save_forces: true
  architecture:
    preset: dpa4-max-v20260911
  training:
    optimizer: AdamW
notes:
  description: >-
    DPA-4.1-Max-OAM-PFT is a phonon-fine-tuned DPA4 potential based on
    DPA-4.1-Max-OAM. It retains the SE(3)-equivariant architecture and energy-derived
    forces and stresses of the base model. Fine-tuning uses Hessian labels from MDR-MP
    PBE ω_q, MPtrj co-training and a regularizer preserving the base model's soft-mode
    response.
  disclosure: >-
    The Hessian-loss weight was selected using κ-103 results; κ-103 therefore informed
    model development. Chemical formulas present in κ-103 were excluded from the PFT
    data and anchor selection. The submitted checkpoint is the final training
    endpoint.
  evaluation: >-
    MD energy and force RMSEs are not reported because the labeled reference data are
    not publicly available.

