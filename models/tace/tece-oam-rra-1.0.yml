environment:
  # Exact torch and OEQ versions are test pins, not TACE compatibility bounds.
  dependencies:
  - tace @ git+https://github.com/xvzemin/tace@81f65a4c188bd09cec8d1419388f7afdcc1b6fd0
  - openequivariance==0.6.4
  - torch==2.13.0
  python_version: '3.13'
openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj, OMat24, sAlex]
model_params: 221853358
training_cost:
  entries:
  - hardware: NVIDIA H20
    count: 32
    hours_per_device: 240.0
hyperparams:
  evaluation:
    max_force: 0.02
    max_steps: 500
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    kappa:
      protocol: phonondb-v1
      displacement_distance: 0.03
      save_forces: true
  architecture:
    graph_construction_radius: 6.0
    n_layers: 8
  training:
    epochs: 3
    batch_size: 512
  upstream_config:
    loss_weights:
      energy: 1
      force: 1
      stress: 1
    num_interaction_channel: 64
    num_product_channel: 256
    mmax: 4
    Lmax: 4
    lmax: 4
    l1l2: l1 <= l2
    correlation: 2
notes:
  description: |
    This model is based on Atomic Cluster Expansion, Edge Cluster Expansion
    and Radial Rotary Attention.

