environment:
  dependencies: [upet==0.3.1, torch==2.14.1, metatomic-torch==0.1.19, metatomic-ase==0.1.4, metatensor-torch==0.10.8]
  python_version: '3.14'
openness: OSOD
architecture_types: [transformer]
train_task: S2EFS
test_task: IS2RE-SR
