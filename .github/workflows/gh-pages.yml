name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    defaults:
      run:
        working-directory: site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        # use the project's pinned pnpm (packageManager field) via corepack
        run: corepack enable && pnpm install

      - name: Download parity assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for kind in energy kappa; do
            manifest="src/lib/parity/$kind-parity-manifest.json"
            asset_dir="static/$kind-parity/assets"
            mkdir -p "$asset_dir"
            mapfile -t assets < <(
              jq -r '.base.asset, .model_assets[].asset, ((.structure_bundles // [])[] | .asset)' \
                "$manifest"
            )
            patterns=()
            for asset in "${assets[@]}"; do
              patterns+=(--pattern "$asset")
            done
            gh release download v1.0.0 \
              --repo janosh/matbench-discovery \
              "${patterns[@]}" \
              --dir "$asset_dir" \
              --clobber
            for asset in "${assets[@]}"; do
              [ -f "$asset_dir/$asset" ] || {
                echo "::error::$manifest references missing release asset $asset"
                exit 1
              }
            done
          done

      - name: Build site
        run: |
          # API docs import phono3py at module scope.
          uv run --with-editable "..[phonons]" ../scripts/make_api_docs.py
          pnpm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
