name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    defaults:
      run:
        working-directory: site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        # use the project's pinned pnpm (packageManager field) via corepack
        run: |
          corepack enable
          pnpm install --config.dangerously-allow-all-builds=true --config.block-exotic-subdeps=false

      - name: Download parity assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for kind in energy kappa; do
            manifest="src/lib/parity/$kind-parity-manifest.json"
            asset_dir="static/$kind-parity/assets"
            mkdir -p "$asset_dir"
            asset_prefix=$(jq -er '.asset_prefix | select(type == "string" and test("^[A-Za-z0-9._-]+$"))' "$manifest")
            assets_file="$RUNNER_TEMP/$kind-parity-assets"
            jq -er --arg prefix "$asset_prefix" \
              '[.base.asset, (.model_assets[] | .[].asset), ((.structure_bundles // [])[] | .asset)]
              | if all(.[]; type == "string" and startswith($prefix + "-")
                and test("^[A-Za-z0-9._-]+-[0-9a-f]{16}\\.json\\.gz$"))
                then .[] else error("invalid parity asset manifest") end' \
              "$manifest" > "$assets_file"
            mapfile -t assets < "$assets_file"
            patterns=()
            for asset in "${assets[@]}"; do
              patterns+=(--pattern "$asset")
            done
            gh release download v1.0.0 \
              --repo janosh/matbench-discovery \
              "${patterns[@]}" \
              --dir "$asset_dir" \
              --clobber
            for asset in "${assets[@]}"; do
              [ -f "$asset_dir/$asset" ] || {
                echo "::error::$manifest references missing release asset $asset"
                exit 1
              }
            done
          done

      - name: Build site
        run: |
          # API docs import phono3py at module scope.
          uv run --with-editable "..[phonons]" ../scripts/make_api_docs.py
          pnpm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  prune-parity-assets:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Delete unreferenced parity assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest_assets() {
            jq -er '.base.asset, (.model_assets[] | .[].asset), ((.structure_bundles // [])[] | .asset)'
          }
          protected=$(mktemp)
          for manifest in site/src/lib/parity/{energy,kappa}-parity-manifest.json; do
            gh api --method GET "repos/$GH_REPO/contents/$manifest?ref=$GITHUB_SHA" \
              --jq .content | base64 --decode | manifest_assets
          done > "$protected"
          gh pr list --state open --limit 1000 \
            --json headRefOid,headRepository \
            --jq '.[] | [.headRepository.nameWithOwner, .headRefOid] | @tsv' |
            while IFS=$'\t' read -r repo sha; do
              for manifest in site/src/lib/parity/{energy,kappa}-parity-manifest.json; do
                if ! gh api --method GET "repos/$repo/contents/$manifest?ref=$sha" \
                  --jq .content | base64 --decode | manifest_assets; then
                  echo "::warning::Skipping unavailable or invalid $repo@$sha $manifest" >&2
                fi
              done
            done >> "$protected"
          sort -u -o "$protected" "$protected"
          gh release view v1.0.0 --json assets \
            --jq '.assets[] | select((.createdAt | fromdateiso8601) < (now - 3600)) | .name' |
            sort -u | comm -23 - "$protected" |
            while IFS= read -r asset; do
              [[ "$asset" == energy-parity-* || "$asset" == kappa-parity-* ]] || continue
              [[ "$asset" =~ -[0-9a-f]{16}\.json\.gz$ ]] || {
                echo "::error::Refusing to delete invalid parity asset name: $asset"
                exit 1
              }
              gh release delete-asset v1.0.0 "$asset" --yes
            done
