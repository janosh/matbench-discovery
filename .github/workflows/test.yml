name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow, avoiding a duplicate release-triggered run
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [tests, release]
        default: tests
        description: Only run tests or release matbench-discovery to PyPI after tests pass.
  workflow_call:

# least-privilege default for GITHUB_TOKEN; all jobs here only read the repo
permissions:
  contents: read

concurrency:
  # Cancel only on same PR number
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: janosh/workflows/.github/workflows/pytest.yml@main
    with:
      os: ${{ matrix.os }}
      python-version: "3.14"
      install-cmd: uv pip install -e .[test,symmetry] --system

  vitest:
    defaults:
      run:
        working-directory: site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        # use the project's pinned pnpm (packageManager field) via corepack
        run: |
          corepack enable
          # Resolve main once: pnpm authorizes Git builds by source URL, not package name.
          printf 'allowBuilds:\n' > pnpm-workspace.yaml
          for package in matterviz svelte-widgets; do
            commit=$(git ls-remote "https://github.com/janosh/$package.git" refs/heads/main | cut -f1)
            [[ $commit =~ ^[0-9a-f]{40}$ ]]
            npm pkg set "devDependencies.$package=github:janosh/$package#$commit"
            printf '  %s@https://codeload.github.com/janosh/%s/tar.gz/%s: true\n' "$package" "$package" "$commit" >> pnpm-workspace.yaml
          done
          # MatterViz's Git subdependency must use the same approved widgets revision.
          printf 'overrides:\n  svelte-widgets: %s\n' "$(npm pkg get devDependencies.svelte-widgets)" >> pnpm-workspace.yaml
          pnpm install --config.strict-dep-builds=false --config.block-exotic-subdeps=false

      - name: Run unit tests
        run: pnpm test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      # same cache as update-site-figs.yml: scripts/evals/discovery.py downloads
      # every active model's WBM predictions, several GB on a cold cache
      - name: Cache model prediction + analysis files
        uses: actions/cache@v6
        with:
          path: |
            models/**/*.csv.gz
            models/**/*.json.gz
            data/mp
            data/wbm
          key: model-preds-${{ hashFiles('models/**/*.yml') }}
          restore-keys: model-preds-

      - name: Run discovery eval script
        run: uv run --with-editable . scripts/evals/discovery.py
