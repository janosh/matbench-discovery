name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow, avoiding a duplicate release-triggered run
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [tests, release]
        default: tests
        description: Only run tests or release matbench-discovery to PyPI after tests pass.
  workflow_call:

# least-privilege default for GITHUB_TOKEN; all jobs here only read the repo
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.event_name != 'release' }}

jobs:
  pytest:
    # Preserve the required check names while keeping Python and its dependencies
    # on the same drive (setup-python on C: + uv cache on D: forces slow copies).
    name: pytest (${{ matrix.os }}) / tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      # Live URL/release checks run once in model-pr-guard, independent of OS.
      # Keep coverage on Linux; tracing the same suite again slows Windows down.
      - name: Run tests
        run: >-
          uv run --no-project --with-editable ".[test,symmetry]" pytest --durations=20
          ${{ github.event_name != 'release' && '-m "not network"' || '' }}
          ${{ matrix.os == 'ubuntu-latest' && '--cov=.' || '' }}

  vitest:
    defaults:
      run:
        working-directory: site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-site

      # pnpm's installed graph includes resolved Git SHAs, unlike package.json.
      # Vitest hashes source/config files and excludes import.meta.glob modules.
      - name: Cache Node bytecode and Vitest transforms
        uses: actions/cache@v6
        with:
          path: |
            site/.cache/node-compile
            site/.cache/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('site/node_modules/.pnpm/lock.yaml', 'site/vite.config.ts', 'site/scripts/**') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ hashFiles('site/node_modules/.pnpm/lock.yaml', 'site/vite.config.ts', 'site/scripts/**') }}-

      - name: Run unit tests
        env:
          NODE_COMPILE_CACHE: .cache/node-compile
        run: npm test -- --maxWorkers=100% --fsModuleCache --fsModuleCachePath=.cache/vitest

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      # same cache as update-site-figs.yml: scripts/evals/discovery.py downloads
      # every active model's WBM predictions, several GB on a cold cache
      - name: Cache model prediction + analysis files
        uses: actions/cache@v6
        with:
          path: |
            models/**/*.csv.gz
            models/**/*.json.gz
            data/mp
            data/wbm
          key: model-preds-${{ hashFiles('models/**/*.yml') }}
          restore-keys: model-preds-

      - name: Run discovery eval script
        run: uv run --with-editable . scripts/evals/discovery.py
