name: Model PR guard

# Model registry, schema, URL and parity checks. New submissions use
# `lifecycle: pending`, so they pass before ingestion adds their payloads and parity
# assets and sets them active. Stale payloads fail the main suite's provenance tests.
# Runs on all PRs, main pushes, and weekly drift checks.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: 41 4 * * 1 # weekly drift check (Mon 04:41 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-pr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      # Reuse the site's immutable downloads; release metadata is still checked live.
      - name: Restore parity assets
        uses: actions/cache/restore@v6
        with:
          path: |
            site/static/energy-parity/assets
            site/static/kappa-parity/assets
          key: parity-assets-${{ hashFiles('site/src/lib/parity/*-parity-manifest.json') }}

      - name: Model registry, schemas, prediction URLs and parity assets
        env:
          GH_TOKEN: ${{ github.token }} # avoids GitHub API rate limits
        run: uv run --with-editable . --with pytest --with jsonschema pytest tests/models/ tests/site/test_parity_assets.py tests/test_enums.py -q --durations=10
