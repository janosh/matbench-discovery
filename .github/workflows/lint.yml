name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install site dependencies
        # use the project's pinned pnpm (packageManager field) via corepack
        env:
          # MatterViz currently references the reviewed svelte-widgets git dependency.
          PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: "false"
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
        run: corepack enable && pnpm install
        working-directory: site

      - name: Run prek
        uses: j178/prek-action@v3.0.0
